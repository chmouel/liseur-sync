# reflex rules for `make dev`. Two rules, in this order:
#
#   1. a .templ edit regenerates *_templ.go
#   2. any Go, JavaScript or CSS change rebuilds and restarts the server
#
# The chain between them is the point: templ writes a _templ.go, which
# rule 2 sees, so editing a template restarts the server without either
# rule knowing about the other. The static assets are in the binary via
# go:embed, so a stylesheet edit needs a restart too — the browser alone
# will not show it.
#
# Regexes rather than globs, because a reflex glob is matched against
# the whole relative path and `*` does not cross a `/`: '*.templ' never
# matches internal/webui/reader.templ, while '\.templ$' does.
#
# -s makes the server a service, so reflex stops the old one before
# starting the next. Without it, every save leaves another process
# holding the port.
#
# The command builds first and then execs, so a compile error is a
# message rather than a dead loop, and the server — not an intervening
# `go run` — is the process that receives the signal to stop.

-r '\.templ$' -- sh -c 'go tool templ generate ./internal/webui/'

-s -r '\.(go|js|css)$' -R '_test\.go$' -- sh -c 'go build -o bin/liseur-sync ./cmd/liseur-sync && exec bin/liseur-sync serve -config "$CONFIG"'
