openapi: 3.1.0
info:
  title: liseur-sync native API
  version: "1.0"
  description: |
    Reading-position sync and reading-statistics API.

    Conventions that apply everywhere:

    - **Auth**: every endpoint except `/healthz`, `/v1/login` and
      `/v1/register` requires `Authorization: Bearer <token>`. Login
      returns a short-lived *auth token* usable only for token
      management; device tokens carry one or more scopes (`sync`,
      `read-insights`, `library-read`, `library-manage`, `admin`).
    - **Identity**: books are *works*. Clients never need a work to
      exist before pushing: call `/v1/works/resolve` with every
      identifier you have and use the returned `work_id`.
    - **Idempotency**: `POST /v1/ops` and `POST /v1/sessions` are safe
      to retry. Replaying the same `op_id`/`session_id` with the same
      payload reports `duplicate`; the same id with a different payload
      is a conflict (never an overwrite).
    - **Delta sync**: `GET /v1/changes?since=<seq>` streams every op
      after `seq` with a high-water mark. If your cursor falls below
      the compaction horizon the server answers 410 `resync_required`;
      fetch `/v1/heads` and resume from its `snapshot_seq`.
    - **Errors**: JSON `{"error": "..."}`. Malformed input is always a
      4xx with a reason, never a 5xx.
  license:
    name: MIT
    url: https://opensource.org/license/mit

servers:
  - url: https://your-instance.example.com

tags:
  - name: auth
  - name: identity
  - name: sync
  - name: sessions
  - name: insights
  - name: library
  - name: opds

paths:
  /healthz:
    get:
      summary: Liveness probe (unauthenticated)
      security: []
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }

  /v1/login:
    post:
      tags: [auth]
      security: []
      summary: Exchange credentials for a short-lived auth token
      description: |
        The auth token (1 h) authorises token management only; it cannot
        sync or read insights. Requires HTTPS unless the instance sets
        `insecure_http`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth_token: { type: string, description: "Short-lived (1 h) token-management credential" }
                  expires_in: { type: integer, description: seconds }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error", description: "HTTPS required" }
        "429": { $ref: "#/components/responses/Error", description: "Rate limited" }

  /v1/register:
    post:
      tags: [auth]
      security: []
      summary: Create an account with an invite code
      description: Registration is invite-only. Invite codes are single-use and expire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite, username, password]
              properties:
                invite: { type: string }
                username: { type: string }
                password: { type: string, minLength: 8 }
                timezone: { type: string, description: "IANA name, default UTC" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error", description: "Invalid or expired invite" }
        "409": { $ref: "#/components/responses/Error", description: "Username taken" }

  /v1/tokens:
    post:
      tags: [auth]
      summary: Create a device token
      description: |
        Requires the login auth token (not a device token). The token
        secret is returned once; store it. Each token is bound to a
        server-generated `device_id` that stamps every op and session it
        pushes.

        `admin` scope may only be requested by a caller who already
        holds an active admin token; otherwise the request is refused
        with `403`. The first admin token on an instance is minted with
        `liseur-sync admin mint-token -scope admin`.

        Legacy clients may send `scope`. New clients send `scopes`.
        Supplying both is accepted only when they describe the same
        singleton set. Responses always return `scopes` and return the
        deprecated `scope` field only for singleton sets.
      security: [{ loginAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              anyOf:
                - required: [scope]
                - required: [scopes]
              properties:
                name: { type: string, example: "Boox Palma" }
                scope:
                  allOf:
                    - { $ref: "#/components/schemas/Scope" }
                  deprecated: true
                  description: "Legacy singleton form."
                scopes: { $ref: "#/components/schemas/ScopeSet" }
                expires_in_seconds: { type: integer }
      responses:
        "201":
          description: Token created; secret shown once
          content:
            application/json:
              schema:
                type: object
                required: [token_id, device_id, name, scopes, secret, expires_at]
                properties:
                  token_id: { type: string }
                  device_id: { type: string }
                  name: { type: string }
                  scope:
                    allOf:
                      - { $ref: "#/components/schemas/Scope" }
                    deprecated: true
                    description: "Present only for singleton scope sets."
                  scopes: { $ref: "#/components/schemas/ScopeSet" }
                  secret: { type: string, description: "Bearer secret, returned exactly once" }
                  expires_at: { type: [string, "null"], format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: |
            `admin` scope requested by a caller who is not already an
            admin.
          content:
            application/json:
              schema:
                type: object
                properties: { error: { type: string } }
    get:
      tags: [auth]
      summary: List your tokens
      security: [{ loginAuth: [] }]
      responses:
        "200":
          description: Token list (secrets never included)
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/TokenInfo" }

  /v1/tokens/{id}:
    patch:
      tags: [auth]
      summary: Update a device token's scopes in place
      description: |
        Preserves the token id, device id, and secret. Requires the
        short-lived login credential. Adding `admin` requires the user
        to already hold an active admin token.
      security: [{ loginAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [scope]
                - required: [scopes]
              properties:
                scope:
                  allOf:
                    - { $ref: "#/components/schemas/Scope" }
                  deprecated: true
                scopes: { $ref: "#/components/schemas/ScopeSet" }
      responses:
        "200":
          description: Token scopes updated in place
          content:
            application/json:
              schema:
                type: object
                required: [status, scopes]
                properties:
                  status: { type: string, const: updated }
                  scope:
                    allOf:
                      - { $ref: "#/components/schemas/Scope" }
                    deprecated: true
                    description: "Present only for singleton scope sets."
                  scopes: { $ref: "#/components/schemas/ScopeSet" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [auth]
      summary: Revoke a token
      security: [{ loginAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/works/resolve:
    post:
      tags: [identity]
      summary: Resolve a file's identifiers to a work
      description: |
        Send every identifier you have for the file. Resolution priority is
        `sha256` → `partial-md5` → `source` → `dc` → `ta`, but every supplied
        identifier that already matches must agree on one work. On a
        high-confidence result, all supplied identifiers are registered as
        aliases and every supplied SHA-256 is registered as an edition of the
        resolved work (this is how identity converges across re-encodes).
        Fuzzy `ta` matches return `confidence: low` — confirm with the
        user before treating it as authoritative. On a low match nothing
        is registered, so a guess cannot be laundered into a certainty;
        send `confirmed: true` once the user has said it is the same
        book, and the match resolves high and registers the identifiers.

        If the identifiers resolve to more than one distinct work, the
        server answers 409 with the conflicting work ids and changes
        nothing; call `/v1/works/merge` to confirm the merge.
      security: [{ deviceToken: [] }]  # requires sync scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifiers]
              properties:
                identifiers:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Identifier" }
                title: { type: string }
                author: { type: string }
      responses:
        "200":
          description: Resolved to an existing work
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveResult" }
        "201":
          description: New work created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveResult" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: Identifiers map to multiple works; nothing changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  works: { type: array, items: { type: string } }

  /v1/works/{id}/split:
    post:
      tags: [identity]
      summary: Detach an edition into a new work
      description: |
        Repairs a wrong merge. Moves the edition and its ops/sessions to
        a new work. Aliases belong to works, not editions, so pass the
        aliases to move explicitly (the edition's own `sha256` alias is
        implied). A different edition's `sha256` alias is rejected.
        Works with compacted session rollups cannot be split because the
        aggregate no longer retains enough edition provenance. The same
        restriction applies to legacy inferred sessions whose edition or
        origin alias cannot be recovered.
      security: [{ deviceToken: [] }]  # requires sync scope
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edition_sha]
              properties:
                edition_sha: { type: string }
                aliases:
                  type: array
                  items: { $ref: "#/components/schemas/Identifier" }
      responses:
        "200":
          description: Split complete
          content:
            application/json:
              schema:
                type: object
                properties: { work_id: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "Edition or history cannot be split from this work" }

  /v1/works/merge:
    post:
      tags: [identity]
      summary: Merge one work into another (explicit confirmation)
      description: |
        Moves aliases, editions, operations, and raw sessions into the
        target work. A source work with compacted session rollups cannot
        be merged because those aggregates no longer retain session
        provenance.
      security: [{ deviceToken: [] }]  # requires sync scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_work_id, into_work_id]
              properties:
                from_work_id: { type: string }
                into_work_id: { type: string }
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                type: object
                properties: { work_id: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "Source work has compacted history" }

  /v1/ops:
    post:
      tags: [sync]
      summary: Push a batch of position ops
      description: |
        Ops are appended to your per-user log with a monotonic `seq`.
        Retries are safe: replaying an `op_id` with the same payload
        returns `duplicate` with the original seq; a reused `op_id` with
        a different payload returns `conflict` and is not stored.
        `device_id` is taken from the token; a client-supplied device id
        is ignored.
      security: [{ deviceToken: [] }]  # requires sync scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/OpInput" }
      responses:
        "200":
          description: Per-item results (valid items applied even if others conflict)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/OpResult" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/changes:
    get:
      tags: [sync]
      summary: Delta-sync every op after a seq
      security: [{ deviceToken: [] }]  # requires sync scope
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 500 } }
      responses:
        "200":
          description: Page of ops with the new high-water mark
          content:
            application/json:
              schema:
                type: object
                properties:
                  ops:
                    type: array
                    items: { $ref: "#/components/schemas/Op" }
                  high_water: { type: integer }
                  has_more: { type: boolean }
        "410":
          description: Cursor below the compaction horizon
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [resync_required] }
                  high_water: { type: integer }
                  heads_endpoint: { type: string }

  /v1/heads:
    get:
      tags: [sync]
      summary: Resync snapshot — newest op per (work, device)
      description: |
        The recovery protocol after `resync_required` (or first sync of
        a fresh client): returns the newest op for every work+device
        pair plus an atomic `snapshot_seq`. Rebuild your baseline from
        the heads, then resume `/v1/changes?since=<snapshot_seq>`.
      security: [{ deviceToken: [] }]  # requires sync scope
      responses:
        "200":
          description: Heads snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ops:
                    type: array
                    items: { $ref: "#/components/schemas/Op" }
                  snapshot_seq: { type: integer }

  /v1/works/{id}/positions:
    get:
      tags: [sync]
      summary: Recent position history for a work (newest first)
      security: [{ deviceToken: [] }]  # requires sync scope
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Recent ops
          content:
            application/json:
              schema:
                type: object
                properties:
                  ops:
                    type: array
                    items: { $ref: "#/components/schemas/Op" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/sessions:
    post:
      tags: [sessions]
      summary: Push a batch of reading sessions
      description: |
        Sessions are append-only facts. Report progression fractions
        measured at the time of reading (`start_progression`,
        `end_progression`); never derive page numbers yourself — the
        server derives pages from edition metadata when known. Same
        `session_id` with a different payload is a 409.
      security: [{ deviceToken: [] }]  # requires sync scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessions]
              properties:
                sessions:
                  type: array
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/SessionInput" }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties: { accepted: { type: integer } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "session_id reused with different payload" }

  /v1/insights/summary:
    get:
      tags: [insights]
      summary: Reading totals, streak, speed over a range
      security: [{ deviceToken: [] }]  # requires read-insights scope
      parameters:
        - { name: range, in: query, schema: { type: string, pattern: "^[0-9]+d$", default: 30d } }
      responses:
        "200":
          description: Aggregates (rereads count time but zero pages)
          content:
            application/json:
              schema:
                type: object
                properties:
                  range_days: { type: integer }
                  total_active_minutes: { type: number }
                  total_pages: { type: number }
                  sessions: { type: integer }
                  streak_days: { type: integer }
                  speed_prog_per_hour: { type: number }

  /v1/insights/works/{id}:
    get:
      tags: [insights]
      summary: Per-work statistics and ETA
      security: [{ deviceToken: [] }]  # requires read-insights scope
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Per-work aggregates; eta_seconds is null when no speed history exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  work_id: { type: string }
                  sessions: { type: integer }
                  total_active_minutes: { type: number }
                  total_pages: { type: number }
                  current_progression: { type: number }
                  eta_seconds: { type: [number, "null"] }
                  last_read_at: { type: [string, "null"], format: date-time }
        "404": { $ref: "#/components/responses/Error" }

  /v1/insights/works:
    get:
      tags: [insights]
      summary: Per-work statistics for every work with reading history
      security: [{ deviceToken: [] }]  # requires read-insights scope
      responses:
        "200":
          description: Per-work aggregates, ordered by active time descending
          content:
            application/json:
              schema:
                type: object
                required: [works]
                properties:
                  works:
                    type: array
                    items:
                      type: object
                      required: [work_id, sessions, total_active_minutes, total_pages, current_progression]
                      properties:
                        work_id: { type: string }
                        sessions: { type: integer }
                        total_active_minutes: { type: number }
                        total_pages: { type: number }
                        current_progression: { type: number }
                        eta_seconds: { type: [number, "null"] }
                        last_read_at: { type: [string, "null"], format: date-time }

  /v1/insights/calendar:
    get:
      tags: [insights]
      summary: Daily reading minutes for a year (user's timezone)
      security: [{ deviceToken: [] }]  # requires read-insights scope
      parameters:
        - { name: year, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Days with activity; midnight-crossing sessions are split
          content:
            application/json:
              schema:
                type: object
                properties:
                  year: { type: integer }
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        minutes: { type: number }
                        pages: { type: number }

  /v1/libraries/{library}/upload:
    post:
      tags: [library]
      summary: Upload an EPUB into a library
      security: [{ deviceToken: [] }]  # requires library-manage scope
      description: |
        Streams one file into the library and returns an *ingest job*.
        The response is `202`, not `201`: the bytes are stored, but the
        book does not exist yet. Validation, metadata extraction and
        promotion happen in background passes; poll
        `/v1/ingest/jobs/{id}` until the state is `promoted` (the job
        then carries `book_id`) or `failed`/`quarantined`.

        The token scope is necessary but not sufficient — the caller
        must also hold manage access to this specific library. A
        library that does not exist and a library the caller cannot
        write to are both `404`, so the endpoint never reveals which.

        Send `Idempotency-Key` and a retry after a lost response
        returns the original job instead of storing the file twice. The
        key is scoped to the caller and library, so two users sharing a
        library never collide. A replayed key returns the first job
        without reading the body: the upload is bound to the job, so
        sending different bytes under a used key does not replace them.
      parameters:
        - name: library
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 200 }
          description: Client-chosen; makes the upload safe to retry.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The EPUB. Other parts are ignored.
              required: [file]
      responses:
        "202":
          description: |
            Stored and queued. Also returned for a replayed
            `Idempotency-Key`, in whatever state that job has reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestJob" }
        "400": { $ref: "#/components/responses/Error", description: "No file part, or a malformed multipart body" }
        "404": { $ref: "#/components/responses/Error", description: "No such library, or no manage access to it" }
        "409": { $ref: "#/components/responses/Error", description: "Idempotency key already used for a different request" }
        "413": { $ref: "#/components/responses/Error", description: "Larger than max_upload_bytes, or over the user's quota" }
        "415": { $ref: "#/components/responses/Error", description: "Not multipart/form-data" }
        "503": { $ref: "#/components/responses/Error", description: "Content storage is not configured on this instance" }

  /v1/libraries:
    get:
      tags: [library]
      summary: Libraries the caller can read
      security: [{ deviceToken: [] }]  # requires library-read scope
      description: |
        Where a catalog client starts: every other route needs a library
        id. `role` is the caller's effective role, so a client knows
        whether to offer uploading.
      responses:
        "200":
          description: Accessible libraries
          content:
            application/json:
              schema:
                type: object
                properties:
                  libraries:
                    type: array
                    items:
                      type: object
                      properties:
                        library_id: { type: string, format: uuid }
                        name: { type: string }
                        source: { type: string, enum: [managed, directory, calibre] }
                        storage: { type: string, enum: [cas, in_place] }
                        refresh: { type: string, enum: [manual, interval] }
                        role: { type: string, enum: [read, manage] }
                        created_at: { type: string, format: date-time }

  /v1/libraries/{library}/books:
    get:
      tags: [library]
      summary: Books in a library
      security: [{ deviceToken: [] }]  # requires library-read scope
      description: |
        Cursor-paginated, oldest first unless `order=recent`. Trashed
        books are excluded. `next_cursor` appears only when a further
        page exists, so a client pages until it is absent. Treat the
        cursor as opaque — it means "where the last page ended", which
        is a different place in each order, so cursors do not carry
        across a change of `order`.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - name: order
          in: query
          description: |
            `recent` is newest first, which is the "what arrived since
            last time" listing. An unrecognized value is refused rather
            than defaulted.
          schema: { type: string, enum: [oldest, recent], default: oldest }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
          description: A `next_cursor` from a previous page.
      responses:
        "200":
          description: One page of the catalog
          content:
            application/json:
              schema:
                type: object
                required: [books]
                properties:
                  books:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogBook" }
                  next_cursor:
                    type: string
                    description: Absent on the last page.
        "400": { $ref: "#/components/responses/Error", description: "Bad limit or malformed cursor" }
        "404": { $ref: "#/components/responses/Error", description: "No such library, or no access" }

  /v1/libraries/{library}/duplicates:
    get:
      tags: [library]
      summary: Books in a library that are the same file
      security: [{ deviceToken: [] }]  # requires library-read scope
      description: |
        Two reports on one route, because a caller asking about
        duplicates wants both.

        `duplicates` groups the library's active books by content digest,
        returning only the digests more than one book holds. Uploading a
        file twice is allowed and costs no extra storage, so this reports
        the coincidence and never resolves it: a client resolves a group
        by deleting whichever entry it chooses. A group split by `limit`
        is omitted rather than returned with a single book in it.

        `similar` is a guess, not a finding: books whose normalized
        titles match and which name a contributor in common, minus any
        pair already reported above, minus books placed at different
        positions in one series. Present it as a question. Nothing on
        this route ever changes anything.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - name: limit
          in: query
          description: Maximum books surveyed, not groups returned.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The duplicate groups
          content:
            application/json:
              schema:
                type: object
                required: [duplicates, similar]
                properties:
                  similar:
                    type: array
                    description: Possible duplicates. A guess; nothing was changed.
                    items:
                      type: object
                      required: [normalized_title, books]
                      properties:
                        normalized_title:
                          type: string
                          description: |
                            The folded title the group was built on, which
                            is what its members have in common rather than
                            any one member's spelling.
                        books:
                          type: array
                          minItems: 2
                          items: { $ref: "#/components/schemas/CatalogBook" }
                  duplicates:
                    type: array
                    items:
                      type: object
                      required: [sha256, books]
                      properties:
                        sha256:
                          type: string
                          description: The digest every book in the group holds.
                          pattern: "^[0-9a-f]{64}$"
                        books:
                          type: array
                          minItems: 2
                          items: { $ref: "#/components/schemas/CatalogBook" }
        "400": { $ref: "#/components/responses/Error", description: "Bad limit" }
        "404": { $ref: "#/components/responses/Error", description: "No such library, or no access" }

  /v1/libraries/{library}/search:
    get:
      tags: [library]
      summary: Find a book in a library
      security: [{ deviceToken: [] }]  # requires library-read scope
      description: |
        Matches `q` against everything a book says about itself — title,
        subtitle, description, publisher, and the names of the series,
        contributors, tags and genres it claims — and returns the best
        matches first. A book *called* Dune outranks one that merely
        mentions it.

        `q` is words, never index syntax. Punctuation and operators are
        split away rather than interpreted, so no query can change how it
        is read; a query made only of punctuation matches nothing.
        Diacritics and case are folded, so `emile` finds `Émile`.

        The answer is unpaged. A relevance order has no stable cursor, and
        this route answers "where is that book" rather than "show me
        everything"; `truncated` says the answer was cut at `limit` so a
        client can ask the person to narrow it rather than implying it
        found all there was. Browsing a whole library is what
        `/v1/libraries/{library}/books` is for.

        `facets` describe the books actually returned, counted over that
        set rather than over the library, and each `id` can be passed back
        as `entity` to narrow the query. A filter needs no `kind`: an id
        already knows what it is. Repeating `entity` ANDs the filters.

        There is no reading-state filter and there will not be one. A
        catalog-only credential must not be able to observe reading state,
        so this route has no vocabulary for it; reading state is reported
        by the `sync` and `read-insights` surfaces, which ask for their
        own scopes.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - name: q
          in: query
          description: The words to match. Absent or empty matches every book, which is useful with `entity`.
          schema: { type: string, maxLength: 512 }
        - name: entity
          in: query
          description: Narrow to books claiming this entity, whatever its kind. Repeatable; filters are ANDed.
          schema: { type: array, items: { type: string, format: uuid }, maxItems: 8 }
        - name: limit
          in: query
          description: Most books returned.
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: The matching books and what they have in common
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/Error", description: "Bad limit, over-long query, or malformed entity filter" }
        "404": { $ref: "#/components/responses/Error", description: "No such library, or no access" }

  /v1/books/{id}:
    get:
      tags: [library]
      summary: One book, with its downloadable files
      security: [{ deviceToken: [] }]  # requires library-read scope
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CatalogBook"
                  - type: object
                    properties:
                      files:
                        type: array
                        description: Available files only.
                        items:
                          type: object
                          properties:
                            file_id: { type: string }
                            media_type: { type: string }
                            sha256: { type: string }
                            filename: { type: string }
        "404": { $ref: "#/components/responses/Error", description: "Unknown book, or no access" }
    delete:
      tags: [library]
      summary: Delete a book
      security: [{ deviceToken: [] }]  # requires library-manage scope
      description: |
        Moves the book to the trash. It leaves the catalog at once and its
        files stop being servable, but the bytes are kept until the
        server's trash retention passes, so the deletion can be undone
        with `POST /v1/books/{id}/restore` until then. Only after that
        does a maintenance pass release the quota and hand the blob to
        the orphan sweep.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The book, now trashed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBook" }
        "404": { $ref: "#/components/responses/Error", description: "Unknown book, or no manage access" }
        "409": { $ref: "#/components/responses/Error", description: "The book is already deleted" }

  /v1/books/{id}/restore:
    post:
      tags: [library]
      summary: Undo a deletion
      security: [{ deviceToken: [] }]  # requires library-manage scope
      description: |
        Returns a trashed book to the catalog, relinking the files it kept.
        It works only inside the retention window. The book comes back as
        `missing` rather than `active` when it has no servable file, so a
        restore never advertises a download that is not there.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The restored book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBook" }
        "404": { $ref: "#/components/responses/Error", description: "Unknown book, or no manage access" }
        "409": { $ref: "#/components/responses/Error", description: "Not in the trash, or its retention window has closed" }

  /v1/libraries/{library}/entities/{kind}:
    get:
      tags: [library]
      summary: The series, contributors, tags or genres in a library
      security: [{ deviceToken: [] }]  # requires library-read scope
      description: |
        Entities are library-wide and shared by every book that claims
        them. `book_count` counts only active books, so an entity whose
        books are all in the trash reads as empty rather than leading to a
        blank page.

        Paging resumes after a name rather than at an offset, because an
        offset would skip or repeat entities as books are added
        underneath it.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/EntityKind" }
        - name: after
          in: query
          description: The `next_after` of the previous page.
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of entities, ordered by name
          content:
            application/json:
              schema:
                type: object
                required: [entities]
                properties:
                  entities:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogEntity" }
                  next_after:
                    type: string
                    description: Absent on the last page.
        "400": { $ref: "#/components/responses/Error", description: "Bad limit or cursor" }
        "404": { $ref: "#/components/responses/Error", description: "No such library or kind, or no access" }

  /v1/libraries/{library}/entities/{kind}/merge:
    post:
      tags: [library]
      summary: Fold two entities into one
      security: [{ deviceToken: [] }]  # requires library-manage scope
      description: |
        Moves every book claiming `from` onto `into` and deletes `from`.
        Matching folds case and spacing only, so two spellings of one
        author stay two entities until somebody says otherwise — which is
        what this route is for, and why it is not a side effect of
        renaming.

        A book that claimed both keeps the row it already had for `into`,
        because a merge decides which entities are the same and not what
        any book asserts. Two things carry over from the losing row, since
        dropping them would discard something a person said: a manual
        lock, and, for a series, a position the surviving row does not
        have.

        This is not reversible.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/EntityKind" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, into]
              properties:
                from: { type: string, format: uuid, description: The entity that disappears. }
                into: { type: string, format: uuid, description: The entity that survives. }
      responses:
        "200":
          description: The merge was applied
          content:
            application/json:
              schema:
                type: object
                required: [moved]
                properties:
                  moved:
                    type: integer
                    description: |
                      Memberships moved. A book that claimed both entities
                      is not counted, because its membership was folded
                      rather than moved.
        "400": { $ref: "#/components/responses/Error", description: "The same entity twice, or a missing id" }
        "404": { $ref: "#/components/responses/Error", description: "No such library, kind or entity, or no manage access" }

  /v1/libraries/{library}/entities/{kind}/{entity}:
    patch:
      tags: [library]
      summary: Respell an entity
      security: [{ deviceToken: [] }]  # requires library-manage scope
      description: |
        Changes the display spelling every book sharing this entity shows.
        A name already held by another entity of the same kind is refused
        with `409` rather than silently merging the two, because that is a
        decision about identity and it has its own route.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/EntityKind" }
        - { name: entity, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
      responses:
        "200":
          description: The renamed entity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntity" }
        "400": { $ref: "#/components/responses/Error", description: "A blank name" }
        "404": { $ref: "#/components/responses/Error", description: "No such library, kind or entity, or no manage access" }
        "409": { $ref: "#/components/responses/Error", description: "Another entity already has that name; merge them instead" }

  /v1/libraries/{library}/entities/{kind}/{entity}/books:
    get:
      tags: [library]
      summary: The books claiming one entity
      security: [{ deviceToken: [] }]  # requires library-read scope
      description: |
        Active books only. A series returns its books in reading order,
        with books that have no position last, because an unplaced book is
        an unanswered question rather than book zero. Every other kind
        returns them oldest first.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/EntityKind" }
        - { name: entity, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The entity and one page of its books
          content:
            application/json:
              schema:
                type: object
                required: [entity, books]
                properties:
                  entity: { $ref: "#/components/schemas/CatalogEntity" }
                  books:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogBook" }
                  next_cursor:
                    type: string
                    description: Absent on the last page.
        "400": { $ref: "#/components/responses/Error", description: "Bad limit or malformed cursor" }
        "404": { $ref: "#/components/responses/Error", description: "No such library, kind or entity, or no access" }

  /v1/books/{id}/metadata:
    get:
      tags: [library]
      summary: One book's metadata with its provenance
      security: [{ deviceToken: [] }]  # requires library-read scope
      description: |
        Everything an edit form needs: each field's value, which
        precedence stage supplied it, and whether a person has locked it.

        This is separate from `GET /v1/books/{id}` because provenance is
        editor data — a catalog client wants the title, not where the
        title came from.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookMetadata" }
        "404": { $ref: "#/components/responses/Error", description: "Unknown book, or no access" }
    put:
      tags: [library]
      summary: Correct a book's metadata
      security: [{ deviceToken: [] }]  # requires library-manage scope
      description: |
        Every accepted change is recorded as `manual` and locks its field
        or set, so the next rescan cannot undo it. That is the point of
        the operation, not a side effect.

        Each field is optional, and an absent field is silence rather than
        a request to clear: a form may submit one field without asserting
        anything about the rest. A field sent with a blank `value` *is* an
        assertion — the user deleted a wrong title — and is honoured,
        unlike a blank from an extractor, which is only ignorance. Sending
        `unlock` instead hands the field back to the extractors without
        asserting a value.

        Sets are replaced whole, because that is what a form does: an
        entry the request omits is one the user removed. An empty set is
        therefore how a set is emptied, and the set lock is what keeps it
        empty, since no row survives to carry a row lock.

        `revision` is required and must be the one the client read.
        Two people editing one book is ordinary in a shared library, and
        last-write-wins would discard the first person's work silently.

        Identifiers are read-only here. They feed work identity, so
        editing one moves a reader's reading history between books; that
        is a different operation with different consequences.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, minimum: 1 }
                title: { $ref: "#/components/schemas/ScalarEdit" }
                subtitle: { $ref: "#/components/schemas/ScalarEdit" }
                description: { $ref: "#/components/schemas/ScalarEdit" }
                publisher: { $ref: "#/components/schemas/ScalarEdit" }
                published_date: { $ref: "#/components/schemas/ScalarEdit" }
                tags: { $ref: "#/components/schemas/SetEdit" }
                genres: { $ref: "#/components/schemas/SetEdit" }
                languages: { $ref: "#/components/schemas/SetEdit" }
                series: { $ref: "#/components/schemas/SetEdit" }
                contributors: { $ref: "#/components/schemas/SetEdit" }
      responses:
        "200":
          description: |
            The metadata after the edit. An edit that changed nothing is
            answered with the current state and does not advance the
            revision, so a resubmitted form does not invalidate the editor
            that sent it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookMetadata" }
        "400": { $ref: "#/components/responses/Error", description: "Malformed body, missing revision, or invalid metadata" }
        "404": { $ref: "#/components/responses/Error", description: "Unknown book, or no manage access" }
        "409": { $ref: "#/components/responses/Error", description: "The book changed while it was being edited" }

  /v1/books/{id}/metadata/lookup:
    post:
      tags: [library]
      summary: Ask external services about a book
      security: [{ deviceToken: [] }]  # requires library-manage scope
      description: |
        Asks the metadata services this server was configured to use what
        they know about a book, and reports what they said. Nothing is
        written: there is no code path from a lookup to the catalog, and
        accepting a candidate is a separate request.

        It needs `library-manage` rather than `library-read` for two
        reasons that point the same way. The result is only useful to
        somebody who could apply it, and a lookup makes this server send
        a request to a third party about one of the operator's books,
        which is not something a read-only credential should cause.

        There is no request body. The query is built from the book — its
        title, its first author, its identifiers — so nothing a client
        sends reaches a provider.

        External lookup is off unless the operator turned it on, and a
        server that was told to contact nobody answers `501`. That is a
        different problem from an empty result and is fixed somewhere
        else entirely.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: |
            What the services said, best match first. An empty list is a
            normal answer: nobody had heard of the book.
          content:
            application/json:
              schema:
                type: object
                required: [providers, candidates]
                properties:
                  providers:
                    type: array
                    description: The services that were asked.
                    items: { type: string }
                  candidates:
                    type: array
                    items: { $ref: "#/components/schemas/MetadataCandidate" }
        "404": { $ref: "#/components/responses/Error", description: "Unknown book, or no manage access" }
        "429": { $ref: "#/components/responses/Error", description: "Too many lookups; see Retry-After" }
        "501": { $ref: "#/components/responses/Error", description: "No metadata provider is configured" }
        "502": { $ref: "#/components/responses/Error", description: "No metadata service could be reached" }

  /v1/books/{id}/metadata/apply:
    post:
      tags: [library]
      summary: Accept one external candidate
      security: [{ deviceToken: [] }]  # requires library-manage scope
      description: |
        Merges one candidate into a book. This is an ordinary metadata
        write: the values are recorded with `external` provenance, which
        ranks above a filename and below a person, so a field somebody
        edited or locked keeps its value and the rest are filled in.

        The candidate is sent back by the client rather than looked up
        again here, because a second lookup can return something else — a
        person would then accept what they read and get what they did
        not. This costs nothing: every value is written with external
        provenance, and the caller already holds the capability that lets
        them type the same thing into the edit form.

        `revision` is required and must be the one the client read, for
        the same reason it is on an edit.

        Identifiers cannot be applied. They decide work identity
        (ADR-0003), so accepting one would move a reader's history
        between books as a side effect of tidying a title. They are
        reported by the lookup only so a person can check they are being
        offered the right edition.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, minimum: 1 }
                provider:
                  type: string
                  description: |
                    Recorded for the person reading the page later, so a
                    value can be traced back to the service that gave it.
                by_identifier: { type: boolean }
                title: { type: string }
                subtitle: { type: string }
                description: { type: string }
                publisher: { type: string }
                published_date: { type: string }
                languages: { type: array, items: { type: string } }
                tags: { type: array, items: { type: string } }
                authors: { type: array, items: { type: string } }
      responses:
        "200":
          description: The metadata after the merge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookMetadata" }
        "400": { $ref: "#/components/responses/Error", description: "Malformed body, or missing revision" }
        "404": { $ref: "#/components/responses/Error", description: "Unknown book, or no manage access" }
        "409":
          $ref: "#/components/responses/Error"
          description: |
            The book changed while it was being looked at, or the
            candidate would change nothing because every field it offers
            is blank, already right, or locked.
        "501": { $ref: "#/components/responses/Error", description: "No metadata provider is configured" }

  /v1/books/{id}/resolve:
    post:
      tags: [library, sync]
      summary: Join a catalog book to your own work
      security: [{ deviceToken: [] }]  # requires BOTH library-read and sync
      description: |
        Returns the `work_id` to report positions and sessions against for a
        book that came from the catalog, creating it on first call.

        Send no identifiers: the server collects them from the catalog. A
        client that has only browsed has not seen the bytes, and two devices
        should resolve the same book from the same evidence.

        The mapping is per user. Two readers of one shared book get two
        different works, which is what keeps reading history private.

        A title/author-only match is a guess: it answers `confidence: low`
        and stores nothing. Repeat with `confirmed: true` to accept it.

        This is the one route that needs two scopes. It reads the catalog
        and writes the caller's work graph, so a catalog-only credential
        cannot perform it and neither can a sync-only one.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmed:
                  type: boolean
                  description: Accept a low-confidence title/author match.
      responses:
        "200":
          description: The existing work, or a low-confidence proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogResolution" }
        "201":
          description: A work was created for this book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogResolution" }
        "400": { $ref: "#/components/responses/Error", description: "Malformed body" }
        "403": { $ref: "#/components/responses/Error", description: "The token lacks library-read or sync" }
        "404": { $ref: "#/components/responses/Error", description: "Unknown book, or no access" }
        "409":
          description: The book's identifiers resolve to more than one work, and nothing was changed
          content:
            application/json:
              schema:
                type: object
                required: [error, works]
                properties:
                  error: { type: string }
                  works: { type: array, items: { type: string } }

  /v1/books/{id}/download:
    get:
      tags: [library]
      summary: Download a book's file
      security: [{ deviceToken: [] }]  # requires library-read scope
      description: |
        Serves the newest available file. Supports `HEAD`, byte ranges
        and conditional requests; `Content-Disposition` carries a
        sanitized filename that is a label, never a path.

        For a book whose bytes this server keeps a copy of, the `ETag` is
        the content digest and never changes, and the answer may be
        cached indefinitely. For a book served in place out of a library
        directory, the bytes belong to whoever owns that directory: the
        `ETag` is weak and the answer is `private, no-cache`. If such a
        file no longer matches what was catalogued — a different size or
        modification time — it is refused with `409` and the book is
        flagged for an administrator rather than served under a title
        that may no longer describe it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Range, in: header, required: false, schema: { type: string } }
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The file
          content:
            application/epub+zip:
              schema: { type: string, format: binary }
        "206": { description: The requested byte range }
        "304": { description: The client's copy is current }
        "404": { $ref: "#/components/responses/Error", description: "Unknown book, or no access" }
        "409": { $ref: "#/components/responses/Error", description: "The file behind this book changed on disk since it was catalogued" }
        "410": { $ref: "#/components/responses/Error", description: "The book exists but its content is no longer stored" }
        "503": { $ref: "#/components/responses/Error", description: "Content storage is not configured on this instance" }

  /v1/books/{id}/cover:
    get:
      tags: [library]
      summary: Fetch a book's cover image
      security: [{ deviceToken: [] }]  # requires library-read scope
      description: |
        Renders the cover declared by the publication and serves it as a
        JPEG. The type is always `image/jpeg` regardless of what the book
        contains, and `X-Content-Type-Options: nosniff` is set: covers are
        publisher-supplied bytes, and this route decides what they are.

        Rendered covers are cached, so the first request for a book pays
        for the decode and later ones do not. The `ETag` combines the
        content digest with the size, both of which are fixed for a given
        book, so a client that has one may reuse it indefinitely — except
        for a book served in place out of a library directory, whose
        bytes are not this server's to promise: there the validator is
        weak and the answer is `private, no-cache`.

        A book whose publication declares no cover, or one this server
        cannot decode, answers `404`. That answer is cached too, so it
        stays cheap for a catalog full of coverless books.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: size
          in: query
          required: false
          description: |
            `thumbnail` is a catalog grid image and the default; `full` is
            sized for a book page. Any other value is rejected rather than
            treated as the default.
          schema: { type: string, enum: [thumbnail, full], default: thumbnail }
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The rendered cover
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "304": { description: The client's copy is current }
        "400": { $ref: "#/components/responses/Error", description: "Unknown cover size" }
        "404": { $ref: "#/components/responses/Error", description: "Unknown book, no access, or no cover this server can serve" }
        "410": { $ref: "#/components/responses/Error", description: "The book exists but its content is no longer stored" }
        "503": { $ref: "#/components/responses/Error", description: "Content storage is not configured on this instance" }

  /opds/v1.2:
    get:
      tags: [opds]
      summary: OPDS 1.2 navigation feed
      security: [{ opdsBasic: [] }]  # requires library-read scope
      description: |
        The catalog root for e-reader clients, and the only entry point
        they need: it lists the caller's libraries, each linking to its
        acquisition feed. `/opds/v1.2/` is accepted too, because readers
        differ on the trailing slash.

        OPDS is catalog-only by design. It exposes no reading positions,
        sessions or statistics even when the token also carries `sync`.
      responses:
        "200":
          description: An Atom navigation feed
          content:
            application/atom+xml;profile=opds-catalog;kind=navigation:
              schema: { type: string }
        "401": { description: "Missing or invalid credentials; carries WWW-Authenticate" }
        "403": { $ref: "#/components/responses/Error", description: "Valid credential without library-read" }

  /opds/v1.2/libraries/{library}:
    get:
      tags: [opds]
      summary: OPDS 1.2 acquisition feed for one library
      security: [{ opdsBasic: [] }]  # requires library-read scope
      description: |
        One page of books, each with an EPUB acquisition link. A `next`
        link appears while more pages remain; readers follow it rather
        than constructing cursors.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque; only ever taken from a `next` link.
      responses:
        "200":
          description: An Atom acquisition feed
          content:
            application/atom+xml;profile=opds-catalog;kind=acquisition:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error", description: "Malformed cursor" }
        "404": { $ref: "#/components/responses/Error", description: "No such library, or no access" }

  /opds/v1.2/libraries/{library}/search.xml:
    get:
      tags: [opds]
      summary: OpenSearch description for one library
      security: [{ opdsBasic: [] }]  # requires library-read scope
      description: |
        Readers find this through the `search` link on the library's
        acquisition feed rather than being configured with it, and read
        the query template out of it. `searchTerms` is the only term
        offered: a reader that could substitute anything else would be
        asking a question this surface deliberately cannot answer.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: An OpenSearch description document
          content:
            application/opensearchdescription+xml:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error", description: "No such library, or no access" }

  /opds/v1.2/libraries/{library}/search:
    get:
      tags: [opds]
      summary: OPDS search results for one library
      security: [{ opdsBasic: [] }]  # requires library-read scope
      description: |
        The same search as `GET /v1/libraries/{library}/search`, rendered
        as an acquisition feed so every result can be downloaded from
        where it was found. It carries no `next` link: the feed is
        unpaged, and the answer to wanting more is a better query.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: An Atom acquisition feed of the matches
          content:
            application/atom+xml;profile=opds-catalog;kind=acquisition:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error", description: "Over-long query" }
        "404": { $ref: "#/components/responses/Error", description: "No such library, or no access" }

  /opds/v1.2/libraries/{library}/recent:
    get:
      tags: [opds]
      summary: OPDS acquisition feed of a library's newest books
      security: [{ opdsBasic: [] }]  # requires library-read scope
      description: |
        The feed a reader opens to see what has arrived since last time,
        reached from the `http://opds-spec.org/sort/new` link on the
        library's own feed. It is `order=recent` on the native listing,
        rendered as a feed.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque; only ever taken from a `next` link.
      responses:
        "200":
          description: An Atom acquisition feed, newest first
          content:
            application/atom+xml;profile=opds-catalog;kind=acquisition:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error", description: "Malformed cursor" }
        "404": { $ref: "#/components/responses/Error", description: "No such library, or no access" }

  /opds/v1.2/libraries/{library}/{kind}:
    get:
      tags: [opds]
      summary: OPDS navigation feed of a library's series, contributors, tags or genres
      security: [{ opdsBasic: [] }]  # requires library-read scope
      description: |
        Reached from the `http://opds-spec.org/facet` links on the
        library's acquisition feed. Each entry leads to the books
        claiming it.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/EntityKind"
        - name: after
          in: query
          schema: { type: string }
          description: Only ever taken from a `next` link.
      responses:
        "200":
          description: An Atom navigation feed
          content:
            application/atom+xml;profile=opds-catalog;kind=navigation:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error", description: "Over-long cursor" }
        "404": { $ref: "#/components/responses/Error", description: "No such library or kind, or no access" }

  /opds/v1.2/libraries/{library}/{kind}/{entity}:
    get:
      tags: [opds]
      summary: OPDS acquisition feed of the books claiming one entity
      security: [{ opdsBasic: [] }]  # requires library-read scope
      description: |
        A series comes back in reading order, with unplaced books last,
        which is the whole reason a reader would rather browse a series
        than search for it.
      parameters:
        - { name: library, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/EntityKind"
        - { name: entity, in: path, required: true, schema: { type: string, format: uuid } }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque; only ever taken from a `next` link.
      responses:
        "200":
          description: An Atom acquisition feed
          content:
            application/atom+xml;profile=opds-catalog;kind=acquisition:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error", description: "Malformed cursor" }
        "404": { $ref: "#/components/responses/Error", description: "No such library, kind or entity, or no access" }

  /opds/v1.2/books/{id}/download:
    get:
      tags: [opds]
      summary: Acquire a book over OPDS
      security: [{ opdsBasic: [] }]  # requires library-read scope
      description: |
        The same download as `/v1/books/{id}/download`, reachable with
        the Basic credential a reader already holds. Ranges, `HEAD` and
        conditional requests behave identically.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The file
          content:
            application/epub+zip:
              schema: { type: string, format: binary }
        "206": { description: The requested byte range }
        "304": { description: The client's copy is current }
        "404": { $ref: "#/components/responses/Error", description: "Unknown book, or no access" }
        "410": { $ref: "#/components/responses/Error", description: "The book exists but its content is no longer stored" }

  /v1/ingest/jobs/{id}:
    get:
      tags: [library]
      summary: Progress of one ingest job
      security: [{ deviceToken: [] }]  # requires library-read scope
      description: |
        Poll after an upload. Visibility follows manage access to the
        job's library, so a library's managers can see everything being
        ingested into it, not only their own uploads.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestJob" }
        "404": { $ref: "#/components/responses/Error", description: "Unknown job, or no access to its library" }

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: Scoped device token (`sync`, `read-insights`, or `admin`)
    loginAuth:
      type: http
      scheme: bearer
      description: Short-lived auth token from /v1/login (token management only)
    opdsBasic:
      type: http
      scheme: basic
      description: |
        OPDS only. Username is the token's name or the literal `token`;
        the password is a device token secret carrying `library-read`.
        Account passwords are rejected — a reader stores its credential
        in plain text on the device.

  parameters:
    EntityKind:
      name: kind
      in: path
      required: true
      description: |
        Which kind of library-wide entity. The set is closed, and a kind
        outside it is a 404 rather than a 400: it names no resource.
      schema:
        type: string
        enum: [series, contributors, tags, genres]

  responses:
    Error:
      description: Error with a human-readable reason
      content:
        application/json:
          schema:
            type: object
            properties: { error: { type: string } }
    StatusOK:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties: { status: { type: string } }

  schemas:
    CatalogResolution:
      type: object
      description: |
        The join between a catalog book and the caller's own sync work,
        plus the identifiers the server used to make it, so a client can
        show why two books were treated as one.
      required: [book_id, work_id, confidence, created, identifiers]
      properties:
        book_id: { type: string }
        work_id: { type: string }
        confidence:
          type: string
          enum: [high, low]
          description: |
            `low` means the match rests on title and author alone. Nothing
            was stored; resend with `confirmed: true` to accept it.
        created:
          type: boolean
          description: Whether this call created the work.
        identifiers:
          type: array
          description: The catalog's evidence, strongest first.
          items:
            type: object
            required: [kind, value]
            properties:
              kind: { type: string, enum: [sha256, partial-md5, source, dc, ta] }
              value: { type: string }

    CatalogBook:
      type: object
      description: |
        One book in a library. Optional metadata fields are omitted when
        unknown rather than sent empty, so a client can tell "no
        publisher recorded" from "publisher is blank".
      required: [book_id, library_id, title, status, created_at, updated_at]
      properties:
        book_id: { type: string, format: uuid }
        library_id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        publisher: { type: string }
        published_date: { type: string }
        status: { type: string, enum: [active, missing, trashed, review] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CatalogEntity:
      type: object
      description: |
        One library-wide series, contributor, tag or genre. Matching folds
        case and spacing while the display spelling is preserved, so
        "Frank  Herbert" and "frank herbert" are one entity spelled one
        way.
      required: [id, name, book_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: The display spelling. }
        book_count:
          type: integer
          description: Active books claiming it. Trashed books do not count.

    SearchResult:
      type: object
      description: |
        One library's answer to a search: the matching books, best first,
        and what those books have in common.
      required: [books, facets, truncated]
      properties:
        books:
          type: array
          items: { $ref: "#/components/schemas/CatalogBook" }
        facets:
          type: array
          description: |
            What the returned books share, at most 20 of each kind, most
            claimed first. Counted over the answer rather than over the
            library, so a facet can never describe a different set than
            the one returned.
          items: { $ref: "#/components/schemas/SearchFacet" }
        truncated:
          type: boolean
          description: |
            The answer was cut at `limit`. Ask the person to narrow it
            rather than paging: there is no cursor.

    SearchFacet:
      type: object
      description: |
        One entity the matching books share. `id` is what to send back as
        the `entity` filter.
      required: [kind, id, name, book_count]
      properties:
        kind: { type: string, enum: [series, contributor, tag, genre] }
        id: { type: string, format: uuid }
        name: { type: string, description: The display spelling. }
        book_count:
          type: integer
          description: Returned books claiming it, not library-wide books.

    MetadataField:
      type: object
      description: |
        One scalar value with its provenance. `source` is the precedence
        stage that supplied it; `locked` means a person asserted it and no
        rescan may overwrite it.
      required: [value, source, locked]
      properties:
        value: { type: string }
        source: { type: string, enum: ["", embedded, filename, external, calibre, manual] }
        locked: { type: boolean }

    MetadataCandidate:
      type: object
      description: |
        One suggestion from one external service. Everything needed to
        judge it is here: which service said it, whether it matched on
        this book's identifier or only on a similar title, and a link to
        the record, because a suggestion nobody can check is one somebody
        accepts on faith.
      required: [provider, score, by_identifier]
      properties:
        provider: { type: string }
        url:
          type: string
          description: The service's own page for this record.
        score:
          type: number
          description: |
            How well it matched, between 0 and 1. An identifier match
            scores highest; a title guess is the caller's judgement to
            make.
        by_identifier:
          type: boolean
          description: |
            True when the service was answering about this book's ISBN
            rather than about a book with a similar title.
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        publisher: { type: string }
        published_date: { type: string }
        languages: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        authors: { type: array, items: { type: string } }
        cover_url: { type: string }
        identifiers:
          type: array
          description: |
            Reported so a person can check they are being offered the
            right edition. They cannot be applied: identifiers decide
            work identity (ADR-0003).
          items:
            type: object
            required: [scheme, value]
            properties:
              scheme: { type: string }
              value: { type: string }

    BookMetadata:
      type: object
      required: [book_id, library_id, revision, title]
      properties:
        book_id: { type: string, format: uuid }
        library_id: { type: string, format: uuid }
        revision:
          type: integer
          description: |
            Send this back to write. Without it an editor cannot tell a
            conflict from a success.
        title: { $ref: "#/components/schemas/MetadataField" }
        subtitle: { $ref: "#/components/schemas/MetadataField" }
        description: { $ref: "#/components/schemas/MetadataField" }
        publisher: { $ref: "#/components/schemas/MetadataField" }
        published_date: { $ref: "#/components/schemas/MetadataField" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/MetadataEntityRow" }
        genres:
          type: array
          items: { $ref: "#/components/schemas/MetadataEntityRow" }
        series:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/MetadataEntityRow"
              - type: object
                properties:
                  position:
                    type: number
                    description: |
                      Omitted when the book has no place in the series. It
                      is never invented, so absent means unknown rather
                      than first.
        contributors:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/MetadataEntityRow"
              - type: object
                required: [role]
                properties:
                  role:
                    type: string
                    description: |
                      One person credited twice in different roles is two
                      rows over one entity.
        languages:
          type: array
          items:
            type: object
            required: [language, source, locked]
            properties:
              language: { type: string }
              source: { type: string }
              locked: { type: boolean }
        identifiers:
          type: array
          description: |
            Read-only. Identifiers feed work identity, so changing one
            moves a reader's reading history between books.
          items:
            type: object
            required: [scheme, value, source, locked]
            properties:
              scheme: { type: string }
              value: { type: string }
              source: { type: string }
              locked: { type: boolean }
        set_locks:
          type: object
          description: |
            Per-set manual locks. A row lock cannot express a
            deliberately emptied set, because removing the last row
            leaves nothing to carry the lock.
          properties:
            tags: { type: boolean }
            genres: { type: boolean }
            languages: { type: boolean }
            series: { type: boolean }
            contributors: { type: boolean }
            identifiers: { type: boolean }

    MetadataEntityRow:
      type: object
      required: [id, name, source, locked]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source: { type: string, enum: [embedded, filename, external, calibre, manual] }
        locked: { type: boolean }

    ScalarEdit:
      type: object
      description: |
        A change to one scalar field. A blank `value` clears the field and
        locks it, which is how a user suppresses a wrong embedded value.
        `unlock` is exclusive with editing: it clears the lock and leaves
        the value alone.
      properties:
        value: { type: string }
        unlock: { type: boolean, default: false }

    SetEdit:
      type: object
      description: |
        A replacement for one whole set. `entries` is the complete new
        membership; an entry that is absent is one the user removed. As
        with a scalar, `unlock` is exclusive with editing.
      properties:
        unlock: { type: boolean, default: false }
        entries:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                description: |
                  The display spelling. An entry whose name matches one
                  the library already has rejoins that entity rather than
                  creating a second one under the same name.
              position:
                type: number
                description: Series only. Omit it rather than sending 0.
              role:
                type: string
                description: Contributors only. Defaults to `author`.

    IngestJob:
      type: object
      description: |
        The progress of one uploaded file on its way to becoming a
        book. `sha256`, `size_bytes` and `book_id` appear as the job
        advances; `error_code` only on `failed` or `quarantined`.
      required: [job_id, library_id, state, source, created_at, updated_at]
      properties:
        job_id: { type: string, format: uuid }
        library_id: { type: string, format: uuid }
        state:
          type: string
          enum: [received, staged, validated, extracted, promoted, quarantined, failed]
          description: |
            `received` means the row exists but bytes may not be
            stored yet; `staged` onwards means they are. `promoted` is
            the only terminal success and is the only state that
            carries `book_id`.
        source:
          type: string
          description: How the file arrived (an upload, or a watched folder).
        sha256:
          type: string
          description: Content digest, present once the bytes are staged.
        size_bytes: { type: integer, format: int64 }
        book_id:
          type: string
          format: uuid
          description: The resulting book. Present only when `promoted`.
        error_code:
          type: string
          description: Why the job stopped. Present only when `failed` or `quarantined`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Scope:
      type: string
      enum: [sync, read-insights, library-read, library-manage, admin]
      description: |
        `library-manage` implies `library-read`; `admin` implies all
        scopes. No other scope implies another. `admin` cannot be
        self-granted: creating or updating a token to include it
        requires an existing admin token or the admin CLI.
    ScopeSet:
      type: array
      minItems: 1
      items: { $ref: "#/components/schemas/Scope" }
      description: |
        A set of token capabilities. Duplicate values are accepted and
        canonicalized; responses use deterministic scope order.
    Identifier:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [sha256, partial-md5, source, dc, ta]
          description: |
            `sha256`: exact file bytes. `partial-md5`: KOReader
            fingerprint (`util.partialMD5`; note LuaJIT's first offset
            overflows to 0, so the first sample is the head of the
            file). `source`: the catalog server's own id for the book
            (e.g. `komga:<id>`), shared by devices browsing the same
            catalog before any of them has the file. `dc`: the EPUB's
            dc:identifier (ISBN, UUID).
            `ta`: normalised title+author (fuzzy).

            `ta` values are compared as exact strings and are never
            normalised by the server, so every client must normalise
            identically or they will silently fail to match each other:
            `fold(title) + "|" + fold(author)`, where fold is NFKD,
            `\p{Mn}` stripped, lowercased, runs of non-alphanumerics
            replaced with a single space, trimmed. Send it only when
            both title and author are known.
        value: { type: string, maxLength: 512 }
    ResolveResult:
      type: object
      properties:
        work_id: { type: string }
        confidence:
          type: string
          enum: [high, low]
          description: |
            `low` only for fuzzy ta: matches. Confirm with the user
            before exchanging any reading state, and remember a refusal
            — a client that forgets will resolve the same book again on
            its next run and ask forever.
        created: { type: boolean }
    TokenInfo:
      type: object
      required: [id, device_id, name, scopes, created_at, revoked]
      properties:
        id: { type: string }
        device_id: { type: string }
        name: { type: string }
        scope:
          allOf:
            - { $ref: "#/components/schemas/Scope" }
          deprecated: true
          description: "Present only for singleton scope sets."
        scopes: { $ref: "#/components/schemas/ScopeSet" }
        created_at: { type: string, format: date-time }
        revoked: { type: boolean }
    OpInput:
      type: object
      required: [op_id, work_id, client_ts, progression]
      properties:
        op_id:
          type: string
          maxLength: 64
          description: |
            Client-generated idempotency key. UUIDv7 is the suggestion,
            but the server treats it as opaque and does not check the
            format. Deriving it from (device, work, revision) rather
            than drawing it at random makes an interrupted push free to
            repeat: the same id with the same payload is `duplicate`,
            the same id with a different payload is `conflict`, never an
            overwrite. That only holds if every field of the payload
            comes from stored state — in particular `client_ts` must be
            the stored update time, not the clock at send time.
        work_id: { type: string, description: "From /v1/works/resolve" }
        edition_sha: { type: string, description: "sha256 of the exact file, if known" }
        client_ts: { type: string, format: date-time }
        progression: { type: number, minimum: 0, maximum: 1 }
        locator:
          type: object
          description: |
            Reader-native position (e.g. Readium locator), opaque to the
            server, replayed verbatim. Refused with 400 above
            `ops.max_locator_bytes` (16 KiB by default), and the refusal
            fails the whole batch. A client with an oversized locator
            should drop it and send the progression alone rather than
            lose the position entirely.
        foreign_pos:
          type: string
          description: Engine-native position string from another protocol (CRe xpointer), stored and replayed verbatim
    Op:
      allOf:
        - $ref: "#/components/schemas/OpInput"
        - type: object
          properties:
            seq: { type: integer, description: Server-assigned per-user monotonic sequence }
            device_id: { type: string }
            origin: { type: string, enum: [native, kosync] }
            received_at: { type: string, format: date-time }
    OpResult:
      type: object
      properties:
        op_id: { type: string }
        status: { type: string, enum: [applied, duplicate, conflict, invalid] }
        seq: { type: integer }
        reason: { type: string }
    SessionInput:
      type: object
      required: [session_id, work_id, started_at, ended_at, start_progression, end_progression]
      properties:
        session_id:
          type: string
          maxLength: 64
          description: |
            Client-generated idempotency key, opaque to the server, same
            bargain as `op_id`. It matters more here: a position sent
            twice is the same position, but an hour sent twice is an
            hour that never happened. Send only sessions that have
            ended, so the payload behind the id can never change.
        work_id: { type: string }
        edition_sha: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        start_progression: { type: number, minimum: 0, maximum: 1 }
        end_progression: { type: number, minimum: 0, maximum: 1 }
        idle_ms: { type: integer, minimum: 0, description: "Reader-visible idle time, excluded from speed" }
