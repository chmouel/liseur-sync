<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>Liseur Sync</title>
  <desc>An open book in an orbit of orchid and gold sync arrows, on deep violet.</desc>
  <defs>
    <linearGradient id="night" x1="64" y1="0" x2="448" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2e2440"/>
      <stop offset=".5" stop-color="#1d1526"/>
      <stop offset="1" stop-color="#120c19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(256 225) rotate(90) scale(240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b79ae0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b79ae0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orchid" x1="112" y1="168" x2="385" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8c62cf"/>
      <stop offset="1" stop-color="#dcc6f5"/>
    </linearGradient>
    <linearGradient id="gold" x1="400" y1="330" x2="139" y2="389" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b98144"/>
      <stop offset="1" stop-color="#f5d291"/>
    </linearGradient>
    <linearGradient id="paper" x1="151" y1="188" x2="253" y2="328" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffbee"/>
      <stop offset="1" stop-color="#ded7ea"/>
    </linearGradient>
    <linearGradient id="leaf" x1="360" y1="183" x2="264" y2="329" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9c4f2"/>
      <stop offset="1" stop-color="#9a76cc"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#night)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="9" y="9" width="494" height="494" rx="104" stroke="#e2d5f5" stroke-opacity=".12" stroke-width="2"/>
  <!-- Two opposing arcs carry the reading position around the book. -->
  <path d="M118 192C141 128 206 99 268 105C313 109 350 132 374 164" stroke="url(#orchid)" stroke-width="17" stroke-linecap="round"/>
  <path d="m350 164 35 18 1-40" fill="#dcc6f5"/>
  <path d="M394 320C371 384 306 413 244 407C199 403 162 380 138 348" stroke="url(#gold)" stroke-width="17" stroke-linecap="round"/>
  <path d="m162 348-35-18-1 40" fill="#f5d291"/>
  <!-- A layered cover and a bright gutter keep the book legible at app size. -->
  <path d="M132 210C180 207 222 226 256 247C290 226 332 207 380 210V330C333 327 291 340 256 357C221 340 179 327 132 330Z" fill="#0f0a17" fill-opacity=".55" transform="translate(0 9)"/>
  <path d="M132 202C180 199 222 218 256 239C290 218 332 199 380 202V326C333 323 291 336 256 353C221 336 179 323 132 326Z" fill="#6b4f9e"/>
  <path d="M142 198C183 199 227 216 256 238C285 216 329 199 370 198V318C327 319 284 333 256 345C228 333 185 319 142 318Z" fill="#d5cbe4"/>
  <path d="M150 183C192 187 226 202 256 228V335C226 314 190 304 150 303Z" fill="url(#paper)"/>
  <path d="M362 183C320 187 286 202 256 228V335C286 314 322 304 362 303Z" fill="url(#leaf)"/>
  <!-- One lifted page doubles as a bookmark / position marker. -->
  <path d="M256 228C275 201 302 181 329 168V282C298 294 275 313 256 335Z" fill="#f6efff"/>
  <path d="M304 182 316 175V223L310 219 304 230Z" fill="#d5a454"/>
  <path d="M256 229V333" stroke="#2b2140" stroke-opacity=".24" stroke-width="3"/>
  <path d="M169 224C192 229 211 237 230 249M169 245C192 250 211 258 230 270M169 266C186 269 200 275 213 282" stroke="#6f6288" stroke-opacity=".38" stroke-width="5" stroke-linecap="round"/>
  <path d="M275 247C285 235 294 227 302 221M275 268C285 256 294 248 302 242" stroke="#6f6288" stroke-opacity=".28" stroke-width="4" stroke-linecap="round"/>
  <!-- A small north star gives the orbit a fixed point. -->
  <path d="m256 139 5 12 12 5-12 5-5 12-5-12-12-5 12-5Z" fill="#f5d291"/>
  <circle cx="108" cy="267" r="5" fill="#c4a7e7"/>
  <circle cx="404" cy="245" r="5" fill="#f5d291"/>
</svg>
