# liseur-sync configuration. All values shown are defaults.
# Env overrides: LISEUR_LISTEN_ADDR, LISEUR_DATABASE_DRIVER,
# LISEUR_DATABASE_URL, LISEUR_CONTENT_ROOT, LISEUR_INSECURE_HTTP,
# LISEUR_OPEN_REGISTRATION, LISEUR_CORS_ORIGINS, LISEUR_TRUSTED_PROXIES.

# Top-level settings must stay above the first [table] header. TOML binds
# a bare key to the table above it, so moving any of these below one
# silently turns it into a key of that table and leaves the real setting
# at its default. The server refuses to start on an unknown key, so a
# misplaced setting is reported rather than ignored.

listen_addr = "127.0.0.1:8585"

# Allow credential traffic over plain HTTP (LAN-only setups). The
# server refuses login/tokens/adapter credentials over HTTP otherwise.
insecure_http = false

# CIDRs whose X-Forwarded-Proto is trusted (your reverse proxy).
# trusted_proxies = ["10.0.0.0/8", "192.168.0.0/16"]

# Browser origins allowed to call the API (future web UI).
# cors_allowed_origins = ["https://reader.example.com"]

# Allow kosync users/create without a pairing code (NOT recommended).
open_registration = false

pairing_code_ttl_min = 15

[database]
driver = "sqlite"                  # sqlite | postgres
url = "liseur-sync.db"             # sqlite path, or postgres DSN

[content]
root = "content"
failure_retention_hours = 24
orphan_grace_hours = 168          # seven days

# How long a deleted book is kept before its files are removed for good.
# Deleting is reversible until this passes, from the books page or with
# POST /v1/books/{id}/restore. The bytes still count against the owner's
# quota while they wait, so that upload-and-delete cycles cannot grow the
# disk without bound.
trash_retention_hours = 720       # thirty days
recovery_batch_size = 100          # ingest jobs and blob housekeeping
ingest_worker_interval_seconds = 5
epub_max_entries = 10000
epub_max_directory_bytes = 67108864       # 64 MiB
epub_max_expanded_bytes = 2147483648      # 2 GiB total
epub_max_entry_bytes = 536870912          # 512 MiB per entry
epub_max_compression_ratio = 1000
epub_max_metadata_bytes = 4194304         # 4 MiB per control document
epub_max_xml_depth = 128

# Largest single upload accepted by POST /v1/libraries/{id}/upload. The
# request is rejected as soon as the body passes this, without waiting
# for the client to finish sending.
max_upload_bytes = 536870912              # 512 MiB

# Total bytes uploads may occupy at once while being received and
# verified, before they are committed to permanent storage. Per-upload
# and per-user limits cannot bound this: every upload can be within both
# and still, together, fill the disk. Uploads over the cap are answered
# 503 with Retry-After. Must be at least max_upload_bytes; 0 disables it.
max_staging_bytes = 8589934592            # 8 GiB

# Total stored bytes allowed per user, counted over deduplicated blobs.
# 0 means unlimited.
quota_bytes = 0

# How often each watched library's root is swept for EPUBs, and how much
# of a root one sweep will look at. The limits are a guard against a root
# that is larger or deeper than you meant to point at: a sweep that hits
# either stops early and, because it cannot claim to have seen the whole
# root, is not allowed to conclude that anything is missing.
watched_scan_interval_seconds = 300
watched_max_files = 200000
watched_max_depth = 32

# Optional lookups against external metadata services. Off unless you
# list a provider here: nothing else in the server makes an outbound
# request, and no scan or ingest ever does — lookup happens only when a
# person asks about one book they can already read.
#
# Results are shown as attributed candidates for somebody to accept or
# ignore; nothing is written to the catalog on their own. Accepting one
# records it as an "external" value, which loses to a field you locked
# and beats one read out of a filename.
#
# Hostnames are fixed in the code (openlibrary.org, www.googleapis.com),
# the allowlist is re-checked on every redirect hop, and only public
# addresses are dialled — a provider cannot be redirected at your LAN or
# your cloud metadata service. HTTP_PROXY is deliberately not honoured.
[metadata]
# providers = ["openlibrary", "googlebooks"]
lookup_timeout_seconds = 8
lookup_max_bytes = 4194304        # 4 MiB, refused rather than truncated
lookup_max_redirects = 3

[adapters]
kosync = true
koplugin = true

[ops]
max_batch = 500
max_body_bytes = 1048576           # 1 MiB
max_locator_bytes = 16384          # 16 KiB
retention_days = 180
compaction_enabled = true          # compact old ops to daily snapshots
inference_gap_min = 15
inference_late_hours = 24             # must be at least the gap, rounded up to hours

