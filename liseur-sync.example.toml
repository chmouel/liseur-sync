# liseur-sync configuration. All values shown are defaults.
# Env overrides: LISEUR_LISTEN_ADDR, LISEUR_DATABASE_DRIVER,
# LISEUR_DATABASE_URL, LISEUR_CACHE_DIR, LISEUR_FOLDER_ROOTS,
# LISEUR_INSECURE_HTTP,
# LISEUR_OPEN_REGISTRATION, LISEUR_CORS_ORIGINS, LISEUR_TRUSTED_PROXIES,
# LISEUR_READER_ORIGIN.

# Top-level settings must stay above the first [table] header. TOML binds
# a bare key to the table above it, so moving any of these below one
# silently turns it into a key of that table and leaves the real setting
# at its default. The server refuses to start on an unknown key, so a
# misplaced setting is reported rather than ignored.

listen_addr = "127.0.0.1:8585"

# Allow credential traffic over plain HTTP (LAN-only setups). The
# server refuses login/tokens/adapter credentials over HTTP otherwise.
insecure_http = false

# CIDRs whose X-Forwarded-Proto is trusted (your reverse proxy).
# trusted_proxies = ["10.0.0.0/8", "192.168.0.0/16"]

# Browser origins allowed to call the API from another hostname.
# cors_allowed_origins = ["https://app.example.com"]

# Serve the browser reader from a second hostname, so that publication
# content is laid out on an origin that holds no session cookie and
# answers no authenticated route. Point this hostname at the same
# server; it serves the reader page and the static assets and nothing
# else. Empty (the default) reads books on the main origin.
# reader_origin = "https://read.example.com"

# Allow kosync users/create without a pairing code (NOT recommended).
open_registration = false

pairing_code_ttl_min = 15

[database]
driver = "sqlite"                  # sqlite | postgres
url = "liseur-sync.db"             # sqlite path, or postgres DSN

[content]
# Rendered covers, and the spool an upload is received into before it is
# placed. Safe to delete while the server is running: the cost is a
# re-render and any upload in flight.
cache_dir = "cache"

# The largest publication an upload may carry. Not a quota — nothing
# counts what a folder holds — but the size above which the server stops
# reading a request body, so one POST cannot fill a disk. Uploads only
# reach folders an administrator marked with
# `liseur-sync admin folder-uploads <id> on`; every other folder is
# read-only to this server, as it always was.
max_upload_bytes = 209715200              # 200 MiB

epub_max_entries = 10000
epub_max_directory_bytes = 67108864       # 64 MiB
epub_max_expanded_bytes = 2147483648      # 2 GiB total
epub_max_entry_bytes = 536870912          # 512 MiB per entry
epub_max_compression_ratio = 1000
epub_max_metadata_bytes = 4194304         # 4 MiB per control document
epub_max_xml_depth = 128

# How much of a folder one pass will look at. These are a guard against a
# root that is larger or deeper than you meant to point at, not a tuning
# knob: a pass that meets either stops early and, because it cannot claim
# to have seen the whole tree, is not allowed to conclude that anything
# is missing. Raise them if you legitimately have a folder this big.
scan_max_files = 200000
scan_max_depth = 32

# Where the admin panel may point a folder.
#
# Adding one names a path on this machine, which is a privilege beyond
# "can administer this application": the form is a filesystem oracle and
# a way to make the scanner read any tree the server can. It is behind
# the administrator's own password, rate-limited and audited, and listing
# the trees you meant to serve here narrows it further. A root is
# accepted when it is one of these or below one.
#
# Empty (the default) means anywhere the server can read, which is what
# `liseur-sync admin add-folder` allows.
# folder_roots = ["/srv/books", "/srv/calibre"]

[adapters]
kosync = true
koplugin = true

[ops]
max_batch = 500
max_body_bytes = 1048576           # 1 MiB
max_locator_bytes = 16384          # 16 KiB
retention_days = 180
compaction_enabled = true          # compact old ops to daily snapshots
inference_gap_min = 15
inference_late_hours = 24             # must be at least the gap, rounded up to hours
