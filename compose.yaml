# liseur-sync deployment. Three database postures via profiles:
#
#   docker compose --profile sqlite up -d      # app + SQLite volume
#   docker compose --profile postgres up -d    # app + bundled Postgres
#   docker compose --profile external up -d    # app + your existing Postgres
#                                              # (set LISEUR_DATABASE_URL in .env)
#
# All variants publish on localhost only; terminate TLS at your reverse
# proxy (see docs/deployment.md). Single replica.
#
# To index a folder of EPUBs or a Calibre library you already have,
# uncomment the two `books` lines in the service you run. The admin
# panel can only name a path this container can see, and library_roots
# bounds it to that one tree. Mount it read-only: the server opens
# library files O_RDONLY and Calibre's metadata.db with `mode=ro`, so
# the mount costs nothing and makes a bug incapable of data loss.

x-app: &app
  image: ghcr.io/chmouel/liseur-sync:latest
  build: .
  # Upgrades are `docker compose up -d`, and that only works if the tag
  # is re-resolved: `docker pull` alone updates the tag while the
  # running container stays bound to the image id it was created from,
  # and `docker restart` never re-creates it. Installations made by
  # scripts/install.sh fetch this file alone, so there is no build
  # context there to fall back to either.
  pull_policy: always
  command: ["serve"]
  restart: unless-stopped
  ports:
    - "127.0.0.1:8585:8585"

services:
  app-sqlite:
    <<: *app
    profiles: ["sqlite"]
    environment:
      LISEUR_LISTEN_ADDR: 0.0.0.0:8585
      LISEUR_DATABASE_DRIVER: sqlite
      LISEUR_DATABASE_URL: /data/liseur-sync.db
      LISEUR_CONTENT_ROOT: /data/content
      # LISEUR_LIBRARY_ROOTS: /books
    volumes:
      - sqlite-data:/data
      # - /srv/books:/books:ro
    depends_on:
      sqlite-init:
        condition: service_completed_successfully

  # Named volumes are root-owned; the app runs as uid 65534. This
  # one-shot container fixes ownership on first run.
  sqlite-init:
    image: busybox
    profiles: ["sqlite"]
    user: root
    entrypoint: ["sh", "-c", "chown -R 65532:65532 /data && chmod 700 /data"]
    volumes:
      - sqlite-data:/data

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: liseur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: liseur_sync
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liseur -d liseur_sync"]
      interval: 5s
      timeout: 3s
      retries: 12

  app-pg:
    <<: *app
    profiles: ["postgres"]
    environment:
      LISEUR_LISTEN_ADDR: 0.0.0.0:8585
      LISEUR_DATABASE_DRIVER: postgres
      LISEUR_DATABASE_URL: postgres://liseur:${POSTGRES_PASSWORD}@postgres:5432/liseur_sync
      LISEUR_CONTENT_ROOT: /data/content
      # LISEUR_LIBRARY_ROOTS: /books
    volumes:
      - content-data:/data
      # - /srv/books:/books:ro
    depends_on:
      postgres:
        condition: service_healthy
      content-init:
        condition: service_completed_successfully

  app-external:
    <<: *app
    profiles: ["external"]
    environment:
      LISEUR_LISTEN_ADDR: 0.0.0.0:8585
      LISEUR_DATABASE_DRIVER: postgres
      LISEUR_DATABASE_URL: ${LISEUR_DATABASE_URL:-}
      LISEUR_CONTENT_ROOT: /data/content
      # LISEUR_LIBRARY_ROOTS: /books
      # Reverse proxy on the docker host reaches the app via the bridge
      # gateway; trust X-Forwarded-Proto from the stack's subnet.
      LISEUR_TRUSTED_PROXIES: ${LISEUR_DOCKER_SUBNET:-172.29.0.0/16}
    volumes:
      - content-data:/data
      # - /srv/books:/books:ro
    depends_on:
      content-init:
        condition: service_completed_successfully
    # The target database and role must already exist; startup
    # migrations need DDL rights on that database.

  content-init:
    image: busybox
    profiles: ["postgres", "external"]
    user: root
    entrypoint: ["sh", "-c", "chown -R 65532:65532 /data && chmod 700 /data"]
    volumes:
      - content-data:/data

volumes:
  sqlite-data:
  pg-data:
  content-data:

# Pinned bridge subnet (default 172.29.0.0/16, override with
# LISEUR_DOCKER_SUBNET) so host services with per-subnet ACLs (e.g.
# PostgreSQL pg_hba) get a stable source range. The external-postgres
# posture reaches a host PG at <subnet gateway>, i.e. 172.29.0.1 by
# default.
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${LISEUR_DOCKER_SUBNET:-172.29.0.0/16}
