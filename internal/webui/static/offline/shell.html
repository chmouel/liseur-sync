<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./assets/style.css">
    <link rel="stylesheet" href="./offline.css">
    <script type="module" src="./offline.js"></script>
    <script type="module" src="./offline-shelf.js"></script>
    <title>Offline shelf · liseur-sync</title>
  </head>
  <body>
    <div id="pull-indicator" class="pullindicator" role="status" aria-live="polite" hidden></div>
    <header class="offline-header">
      <a class="brand" href="../library"><img class="brand-icon" src="./icon.svg" width="40" height="40" alt=""><span class="brand-name"><span class="brandmark">Liseur</span><span class="suffix">sync</span></span></a>
      <a class="btn" href="../library">Open library <span aria-hidden="true">→</span></a>
    </header>
    <main class="offline-shell">
      <p class="eyebrow">Available on this device</p>
      <h1>Offline shelf</h1>
      <p class="lead">Selected books saved here can be opened without a network connection.</p>
      <p class="muted" id="offline-status">Loading saved books…</p>
      <section id="offline-books" class="offline-books" aria-label="Books available offline"></section>
    </main>
  </body>
</html>
