<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Liseur">
    <meta name="theme-color" id="offline-theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" id="offline-theme-color-dark" media="(prefers-color-scheme: dark)" content="#18181a">
    <script src="./offline-net.js"></script>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./assets/style.css">
    <link rel="stylesheet" href="./offline.css">
    <script type="module" src="./offline.js"></script>
    <script type="module" src="./offline-shelf.js"></script>
    <title>Offline shelf · liseur-sync</title>
  </head>
  <body>
    <div id="pull-indicator" class="pullindicator" role="status" aria-live="polite" hidden></div>
    <header class="offline-header">
      <a class="brand" id="offline-brand" href="../library"><img class="brand-icon" src="./icon.svg" width="40" height="40" alt=""><span class="brand-name"><span class="brandmark">Liseur</span><span class="suffix">sync</span></span></a>
      <div class="offline-header-actions">
        <a class="btn offline-needs-network" id="offline-open-library" href="../library">Open library <span aria-hidden="true">→</span></a>
        <p class="offline-note" id="offline-network-note" role="status" hidden>You're offline, your library will be back when you reconnect.</p>
      </div>
    </header>
    <main class="offline-shell">
      <h1>Offline shelf</h1>
      <p class="muted" id="offline-status" tabindex="-1">Loading saved books…</p>
      <p id="offline-notice" class="visually-hidden" role="status" aria-live="polite"></p>
      <section id="offline-books" class="offline-books" aria-label="Books available offline"></section>
    </main>
  </body>
</html>
