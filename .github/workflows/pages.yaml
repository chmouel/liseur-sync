name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the app screenshots
        run: cp -r docs/screenshots docs/site/img/app
      - name: Version the stylesheet link
        run: |
          # Pages lets browsers cache files for ten minutes, so a new page
          # must not be paired with an old stylesheet.
          sed -i "s#site\.css\"#site.css?v=${GITHUB_SHA::8}\"#" docs/site/index.html docs/site/*/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
