name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate templ
        run: go tool templ generate ./internal/webui/
      - name: Build static binaries (amd64 + arm64)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags='-s -w' \
              -o dist/liseur-sync-linux-$arch ./cmd/liseur-sync
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  container:
    runs-on: ubuntu-latest
    env:
      KOCACHE: /tmp/ko-cache
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache ko layer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: /tmp/ko-cache
          key: ${{ runner.os }}-ko-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-ko-
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - name: Generate templ
        run: go tool templ generate ./internal/webui/
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish with ko (multi-arch, no daemon)
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
          VERSION_TAGS: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
        run: ko build --bare --platform=linux/amd64,linux/arm64 --tags "$VERSION_TAGS" ./cmd/liseur-sync
      - name: Smoke-test the published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
        run: |
          docker pull "$IMAGE"
          docker run -d --name ls -p 127.0.0.1:18585:8585 \
            --tmpfs /data:rw,uid=65532,gid=65532 \
            -e LISEUR_LISTEN_ADDR=0.0.0.0:8585 \
            -e LISEUR_DATABASE_URL=/data/liseur-sync.db \
            -e LISEUR_CONTENT_ROOT=/data/content \
            "$IMAGE" serve
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf http://127.0.0.1:18585/healthz; then break; fi
          done
          curl -sf http://127.0.0.1:18585/healthz | grep -q ok
          docker rm -f ls
