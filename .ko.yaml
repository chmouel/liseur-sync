# ko build config: static binary on distroless nonroot (uid 65532).
defaultBaseImage: gcr.io/distroless/static-debian12:nonroot

builds:
  - id: liseur-sync
    main: ./cmd/liseur-sync
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # Same stamp as the static binaries (build.yaml): the overview
      # page has to name a build for the deployment least able to find
      # out any other way. A checkout with no tag stamps the branch's
      # commit, which buildinfo shortens.
      - -X github.com/chmouel/liseur-sync/internal/buildinfo.Version={{.Git.Tag}}
      - -X github.com/chmouel/liseur-sync/internal/buildinfo.Revision={{.Git.FullCommit}}
